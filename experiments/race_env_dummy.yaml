# Smoke test of a custom Gymnasium environment: RaceEnv (Crash&Learn Grand Prix, F1Tenth simulation), copied into
# custom_environments/race_env. Very few epochs: this checks the pipeline, it does not train anything.
#
# RaceEnv has a continuous action space Box(2,) (target speed, steering, both in [-1, 1]); the dummy (random) model
# drives it as-is. See race_env_dqn.yaml for the discretized variant.

name: "race_env_dummy"

environments:
  - name: "RaceEnv-v0"
    # Custom environment: registered in Gymnasium by Hercule under `name`
    entry_point: "race_env:RaceEnv"
    # Relative to this YAML file; race_env.py imports env_simulation by its bare module name
    python_path: ["../custom_environments/race_env"]
    hyperparameters:
      - key: "max_episode_steps"
        value: 300

models:
  - name: "dummy"
    hyperparameters:
      - key: "seed"
        value: 42

learn_max_epoch: 5
test_epoch: 2
save_every_n_epoch: 5
base_output_dir: "outputs"
