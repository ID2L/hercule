# Deep Q-Learning on CarRacing-v3 (Box2D, pixel observations).
#
# Requires the Box2D extra: `uv add "gymnasium[box2d]"`.
#
# A 2x2 balanced grid (learning_rate x target_update_frequency) against the
# random baseline: 5 runs, ~55 min. Balanced and factorial on purpose -- the
# report's variance decomposition is exact only on a full cartesian design, so
# four hand-picked disparate parameter sets would make its eta-squared numbers
# meaningless. Both axes probe the replay fix: learning_rate is the dominant
# factor measured on other DQN families here, and target_update_frequency is the
# target-network lag that the fix gave its own period.
#
# The design is SATURATED (one run per cell, single seed), so interaction and
# run-to-run noise are mathematically inseparable -- read the numbers as a
# direction to explore, not as a measurement.
#
# Action space: CarRacing-v3 exposes two of them, selected by the `continuous`
# kwarg -- Box(3,) when `continuous: true` (steer/gas/brake) and Discrete(5)
# when `continuous: false` (do-nothing/left/right/gas/brake). DQN argmaxes over
# a finite set of Q-values, so only the discrete variant is usable here;
# `DeepQLearningModel.configure()` rejects a Box action space outright. The
# continuous variant is therefore NOT declared below: environments x models is a
# full cartesian product, so adding it would pair it with `deep_q_learning` too
# and break every DQN run in this experiment.
#
# Observations are (96, 96, 3) uint8 frames, so `QNetwork` takes its CNN branch
# (Conv 8x4 / 4x2 / 3x1 -> 4096 -> 512 -> 5, ~2.2M parameters). Two consequences
# drive the sizing choices below:
#   * the replay buffer holds two float32 (96, 96, 3) copies per transition
#     (~216 KB), so `replay_buffer_size: 2000` already costs ~430 MB of RAM;
#   * `model.json` is JSON, so one checkpoint of that network is ~139 MB --
#     hence a large `save_every_n_epoch`.
#
# Measured cost, warm, on CPU: ~2.9 s of environment stepping per 400-step
# episode plus ~15.5 ms per gradient update, i.e. ~4.5 s per episode at
# `step_modulo: 4` (100 updates) against ~10 s at `step_modulo: 1` (400). The
# gradient updates dominate, so `step_modulo` is the knob that trades learning
# per episode against wall-clock.

name: "dq_car_racing"

environments:
  - name: "CarRacing-v3"
    hyperparameters:
      # Discrete(5) action space -- mandatory for DQN, see header.
      - key: "continuous"
        value: false
      # Fixed track colours: domain randomization would change the visual
      # statistics between episodes and there is no frame normalization here.
      - key: "domain_randomize"
        value: false
      - key: "lap_complete_percent"
        value: 0.95
      # Default is 1000. Shortened to keep the episode/checkpoint granularity
      # workable; 400 steps still yields 100 gradient updates per episode.
      - key: "max_episode_steps"
        value: 400

models:
  # Random-action baseline: gives the "did DQN learn anything at all" reference.
  - name: "dummy"
    hyperparameters:
      - key: "seed"
        value: 42

  - name: "deep_q_learning"
    hyperparameters:
      - key: "learning_rate"
        value: [0.0001, 0.00025]
      - key: "discount_factor"
        value: 0.99
      - key: "epsilon"
        value: 1.0
      # Multiplicative, per step: reaches epsilon_min after ~4600 steps, i.e.
      # exploration is annealed within the first ~12 episodes.
      - key: "epsilon_decay"
        value: 0.0005
      - key: "epsilon_min"
        value: 0.1
      - key: "replay_buffer_size"
        value: 2000
      - key: "batch_size"
        value: 32
      # Replay every 4 environment steps, as in the Atari DQN setup.
      - key: "step_modulo"
        value: 4
      # Target-network lag, in steps: ~0.6 vs ~2.5 episodes at 400 steps each.
      - key: "target_update_frequency"
        value: [250, 1000]
      - key: "weight_decay"
        value: 0.0
      - key: "seed"
        value: 42

# 150 episodes x 100 updates = ~15k gradient steps. Runs are resumable, so
# raising this and re-running continues where it stopped.
learn_max_epoch: 150
test_epoch: 20
# ~139 MB per checkpoint (JSON-serialized CNN), keep this coarse.
save_every_n_epoch: 50
base_output_dir: "outputs"
