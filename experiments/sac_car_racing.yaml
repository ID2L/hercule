# Soft Actor-Critic on CarRacing-v3 (Box2D, pixel observations, continuous
# control) -- the project's stated target environment (SC-007, User Story 4).
#
# The bar is SC-007: at epoch 700, mean test reward over 20 evaluation episodes
# at least +65.63, i.e. it must beat the measured random-policy baseline of
# -34.37 by at least 100 reward points. That baseline was measured for the
# specification itself (20 episodes, uniform action sampling, seeds 1000-1019,
# `specs/007-sac-continuous-control/spec.md` Measured Baselines) and MUST NOT be
# re-derived here -- this config only trains and evaluates against it.
#
# `learn_max_epoch: 700` deliberately matches `experiments/dq_car_racing.yaml`
# so the two runs -- discrete-action DQN and continuous-action SAC on the same
# environment -- are directly comparable. For the same reason the environment
# hyperparameters below (fixed track colours, full episodes) mirror that
# config exactly; only `continuous` differs, since SAC requires a `Box` action
# space (`SACModel.configure()` rejects `Discrete` outright) while DQN requires
# the opposite.
#
# `frame_stack: 3` gives the agent the current frame plus the 3 preceding, i.e.
# 4 frames total -- the stack size every published CarRacing agent uses, and
# what makes velocity observable at all from a single frame. NB this parameter
# counts PREVIOUS frames, unlike gymnasium's own FrameStackObservation (and SB3),
# where it is the total.
#
# `learning_starts: 5000` is a longer uniform-random warmup than the oracle/
# Pendulum rungs' (500/1000): a five-network actor-critic needs more transitions
# in the buffer before its first gradient step is worth taking, and 5000 steps is
# a small fraction of the 700 x 1000-step budget below. `step_modulo: 4` mirrors
# the Nature 2015 DQN convention already used by `dq_car_racing.yaml`: one
# gradient step every 4 environment steps.
#
# `replay_buffer_size: 50000` stores stacked (96, 96, 12) uint8 observations at
# ~216 KB per transition (measured in `dq_car_racing.yaml`, unstacked-uint8-only
# storage), i.e. ~10.3 GB at capacity -- a deliberate choice for this run, not
# the 5000-transition memory ceiling DQN accepted on the same environment.
#
# Checkpoint interval: a SAC checkpoint on this environment is ~129 MB (five
# networks plus optimizer state for the three that are trained -- see SC-008's
# Measured Baselines derivation), against DQN's own two-network, one-optimizer
# checkpoint on the same environment. Per-episode wall-clock cost for THIS
# model on THIS environment has not been measured the way DQN's 13.4 s/episode
# was, so the interval below is chosen from checkpoint weight alone rather than
# a time-based schedule: `save_every_n_epoch: 100` gives 7 rewrites over the
# full run (~900 MB of total checkpoint writes) instead of DQN's 14, trading a
# larger worst-case loss on a crash (100 episodes instead of 50) for roughly a
# third of the cumulative write volume DQN's own 50-epoch interval would cost
# at this model's ~3x heavier checkpoint.

name: "sac_car_racing"

environments:
  - name: "CarRacing-v3"
    hyperparameters:
      # Box(3,) action space (steer/gas/brake) -- mandatory for SAC, see header.
      - key: "continuous"
        value: true
      # Fixed track colours: domain randomization would change the visual
      # statistics between episodes and there is no frame normalization here.
      - key: "domain_randomize"
        value: false
      - key: "lap_complete_percent"
        value: 0.95
      # Full episodes (the env default), matching dq_car_racing.yaml so the
      # two runs are directly comparable.
      - key: "max_episode_steps"
        value: 1000

models:
  - name: "sac"
    hyperparameters:
      - key: "learning_starts"
        value: 5000
      - key: "batch_size"
        value: 64
      - key: "replay_buffer_size"
        value: 50000
      - key: "step_modulo"
        value: 4
      - key: "frame_stack"
        value: 3
      - key: "seed"
        value: 42

learn_max_epoch: 700
test_epoch: 20
save_every_n_epoch: 100
base_output_dir: "outputs"
