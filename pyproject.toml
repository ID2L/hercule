[project]
name = "hercule"
version = "0.1.0"
description = ""
authors = [{ name = "guilhem.heinrich", email = "guilhem.heinrich@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "gymnasium[toy-text] (>=1.2.0,<2.0.0)",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "jinja2 (>=3.1.6,<4.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "torch>=2.0.0",
    "jupytext>=1.16,<2",
    "nbformat>=5.10,<6",
    "nbconvert>=7.16,<8",
    "ipykernel>=7.1,<8",
]

[project.scripts]
hercule = "hercule.cli:cli"
gen-doc = "pyscaf.documentation.scripts.parse_doc:gen_doc"
serve-doc = "pyscaf.documentation.scripts.parse_doc:serve_doc"

[project.optional-dependencies]
pdf = [
    "playwright>=1.49,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pdoc",
    "tomli",
    "pytest",
    "pytest-cov",
    "ruff>=0.16.0",
    "pypdf>=5.1,<6",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = ["src/hercule", "pyscaf"]

[tool.hatch.build.targets.wheel]
include = ["src/hercule", "pyscaf"]

[tool.hatch.build.targets.wheel.sources]
"src/hercule" = "hercule"
"pyscaf" = "pyscaf"

[tool.pyscaf.documentation]
output_path = "docs"
package_paths = ["src/hercule"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--color=yes"
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.ruff]
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4",  # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",   # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",   # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "N",   # pep8-naming - https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "W",   # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",   # isort - https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "TID", # flake8-tidy-imports - https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "TC", # flake8-type-checking - https://docs.astral.sh/ruff/rules/#flake8-type-checking-tch
    "PLC", # pylint conventions - https://docs.astral.sh/ruff/rules/#pylint-plc
    "PLE", # pylint errors - https://docs.astral.sh/ruff/rules/#pylint-ple
    "PLW", # pylint warnings - https://docs.astral.sh/ruff/rules/#pylint-plw
]

# Configuration spécifique pour les imports
[tool.ruff.lint.isort]
known-first-party = ["hercule"]
force-single-line = false
lines-after-imports = 2

# Configuration pour les imports tidy
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"  # Interdit les imports relatifs vers les parents

# Configuration pour éviter les imports incohérents
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src.hercule.config".msg = "Use 'hercule.config' instead for consistency"
"src.hercule.environnements".msg = "Use 'hercule.environnements' instead for consistency"
"src.hercule.models".msg = "Use 'hercule.models' instead for consistency"
"src.hercule.run".msg = "Use 'hercule.run' instead for consistency"

